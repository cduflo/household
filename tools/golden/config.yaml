# golden-watch configuration
# Everything the watcher knows about lives here. Edit freely; `gw run` reads it fresh.

owner:
  name: Chris
  base: West Hartford, CT
  max_miles: 250
  timezone: America/New_York

  # Used verbatim by `gw draft`. Written the way you'd actually say it out loud.
  # household lives in owner.local.yaml (untracked) — it describes when the
  # house is occupied and how a child moves through the neighborhood.
  temperament: >-
    a steady family companion, temperament first — sound, biddable, easy with
    kids and with a house that has people coming and going
  lifestyle: >-
    outdoors constantly — hiking, the Farmington River trail, beach trips down to
    the CT and RI shore
  # phone, daughter_age and dog_history live in owner.local.yaml (untracked).
  # See owner.local.yaml.sample.
  vet_reference: false   # not in contact with the old vet; don't offer one

# ---------------------------------------------------------------------------
# TARGETING
#
# line: show | field | dual | any
#   Goldens are one breed but two populations that split decades ago. American
#   conformation lines run blockier, lighter coated, lower drive. Field lines run
#   leaner, darker, and carry a work ethic that does not switch off. For a family
#   companion in a house where two people work from home, show lines are the
#   better fit — and the titles on the parents tell you which you're looking at
#   before anyone gets a chance to describe a temperament to you.
#
#   gw/lines.py does the reading. CH / GCH / BISS are conformation. FC / AFC / MH
#   are field. JH, WC, WCX, CD, agility and dock titles are earned by both and
#   prove nothing about line, which is a common source of confusion.
#
# sex: a preference, not a filter. Breeders match individual puppies to homes,
#   and being rigid about sex moves you down waitlists for no real gain. State it
#   once, then let them place the right dog.
# ---------------------------------------------------------------------------
preferences:
  line: show

  # Hard filter, not a lean. It costs waitlist position and that's accepted:
  # a golden litter runs about eight, roughly half female, and a show breeder
  # often holds one back for the ring — so realistically two or three available
  # females per litter. The right response to a hard constraint is to state it
  # early and plainly so breeders self-select, rather than discovering the
  # mismatch after they've worked you up the list.
  sex: female
  sex_is_flexible: false

  # Timing is the constraint that flexes. Fall is preferred; spring is fine.
  # Contact windows key off the earlier date so nothing is missed, and the
  # fallback is what makes the December Specialty the anchor event rather than
  # a nice-to-have.
  target_fallback_date: 2027-04-15

  # When you want a puppy actually home. Drives the contact windows below.
  # Yankee GRC, in writing: "it's best to contact us about 2 months before you
  # are ready to bring home a puppy." Puppies go home at ~8 weeks, and breeders
  # only list with referral when a litter is within a few weeks or already on
  # the ground. So a referral desk contacted a year out has nothing to give you.
  target_home_date: 2026-10-15

telegram:
  # Create a bot with @BotFather, then message it once and grab your chat id
  # from https://api.telegram.org/bot<TOKEN>/getUpdates
  # Leave blank to read from env: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  bot_token: ""
  chat_id: ""

watcher:
  # Be a good citizen. These are volunteer-run sites on cheap hosting.
  min_interval_hours: 12
  request_delay_seconds: 4
  user_agent: "golden-watch/1.0 (personal puppy search; contact: you@example.com)"
  alert_threshold: 3

# ---------------------------------------------------------------------------
# CLUB REFERRALS
#
# Verified July 2026. Every New England GRCA member club gates litter listings
# behind a human volunteer — none publish litters on the open web. So these are
# not scrape targets. They are a contact cadence: the watcher flags a club when
# it has gone stale, and you send the email.
# ---------------------------------------------------------------------------
clubs:
  # Ordered by approximate drive time from West Hartford. Sourced from GRCA's
  # official club list, July 2026 — which corrects two things:
  #   * Vermont has NO GRCA member club. The "Green Mountain GRC" that turns up
  #     in AKC's club search is not on GRCA's roster; dropped.
  #   * New Hampshire and Rhode Island have none either.
  # Each club refers only to its own members, confirmed in writing by Yankee, so
  # there is no overlap to exploit. Thirteen clubs means thirteen conversations.

  # ---- inside an hour ----
  - key: sbgrc
    name: Southern Berkshire GRC
    territory: Hartford CT -> Springfield MA
    drive: "10 min"
    referral_contact: ""
    referral_email: ""
    url: https://www.sbgrc.org/puppyreferral
    method: email
    recontact_days: 45
    next_event: "your Specialty at the Big E on December 5th"

  - key: crvgrc

# ---------------------------------------------------------------------------
# PAGES TO WATCH
#
# type: litter   -> diff for litter announcements, alert loudly
# type: events   -> club calendars; showing up in person is the real back door
# type: referral -> club referral pages; alert only if they start publishing
# ---------------------------------------------------------------------------
watch:
  # The `focus` tag matters more than it looks. Conformation people and field
  # people are largely different crowds in different rooms, and you want the
  # conformation rooms.
  - key: sbgrc_events
    label: SBGRC calendar
    url: https://www.sbgrc.org/
    type: events
    focus: mixed
    note: >
      Fun match and specialty draw conformation. Hunt test at Nod Brook and
      WC/WCX draw field. Big E public education draws both and is the easiest
      room to walk into cold.
  - key: hvgrc_events
    label: HVGRC calendar
    url: https://hvgrc.org/main/calendar-list/
    type: events
    focus: mixed
    note: >
      The September all-breed health clinic is the highest-value date on either
      calendar: a room full of breeders getting hips, elbows and hearts done.
  - key: sbgrc_referral
    label: SBGRC puppy referral
    url: https://www.sbgrc.org/puppyreferral
    type: referral
  - key: ygrc_referral
    label: Yankee GRC referral
    url: http://yankeegrc.org/BreederContact.asp
    type: referral
  - key: crvgrc_referral
    label: CRVGRC breeder referral
    url: https://www.crvgrc.org/breeder/
    type: referral

# ---------------------------------------------------------------------------
# BREEDERS
#
# This is the list that actually matters, and it starts nearly empty on purpose.
# You fill it from club referral replies, from AKC conformation results, and from
# talking to people at the club events above. `gw add-breeder` appends here
# without eating these comments.
#
# kennel_prefix: the registered name prefix, used for OFA lookup
# line:          show | field | dual | unknown — run `gw line` on their pedigree
#                page to set this rather than guessing from photos
# watch_urls:    pages that change when a litter is planned
# ---------------------------------------------------------------------------
breeders:
  - key: meirzah
    name: Meirzah Golden Retrievers
    kennel_prefix: Meirzah
    location: Northeast
    site: https://www.meirzahgoldenretrievers.com/
    watch_urls:
      - https://www.meirzahgoldenretrievers.com/
    email: ""
    status: researching        # researching | contacted | replied | waitlist | passed
    line: unknown              # set from parent titles, not from the photos
    notes: "States GRCA Code of Ethics adherence; publishes dam status and OFA timing on site."
